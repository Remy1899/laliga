<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Коллекция - Ла Лига</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff4b44 0%, #ffffff 50%, #d9403a 100%);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.1) 0%, transparent 80%);
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 2px solid #FFD700;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 5px 12px;
            border: 2px solid #FFD700;
        }

        .logo-img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        .pack-btn, .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff4b44 0%, #d9403a 100%);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid #FFD700;
            cursor: pointer;
        }

        .home-btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #5a4ace 100%);
        }

        .pack-btn:hover, .home-btn:hover {
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
            font-size: 2rem;
        }

        .sub {
            text-align: center;
            color: #ff4b44;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Статистика */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255,255,255,0.8);
            border-radius: 16px;
            border: 1px solid #FFD700;
        }

        .stat-card {
            background: #1B3B6F;
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
        }

        /* Фильтры */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #e9ecef;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #ff4b44;
            color: white;
        }

        /* Коллекция */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            max-height: 550px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 16px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s;
            border: 2px solid #ddd;
            cursor: pointer;
            position: relative;
        }

        .card.owned {
            border-color: #2a9d8f;
            background: linear-gradient(135deg, #fff 0%, #e8f5f3 100%);
        }

        .card.not-owned {
            border-color: #ccc;
            background: #f5f5f5;
            filter: grayscale(0.6);
            opacity: 0.7;
        }

        .card-img {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            background: #eee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .card-name {
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .card-rating {
            font-size: 0.75rem;
            color: #FFD700;
            margin-top: 4px;
        }

        .card-duplicates {
            font-size: 0.7rem;
            color: #ff4b44;
            margin-top: 4px;
        }

        .badge-mini {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-legendary { background: #FFD700; color: #1B3B6F; }
        .badge-epic { background: #9b59b6; color: white; }
        .badge-rare { background: #3498db; color: white; }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 3px solid #FFD700;
        }

        .modal-content img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 10px auto;
        }

        .close-modal {
            background: #ff4b44;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            color: #1B3B6F;
        }
    </style>
</head>

<div class="container">

    <div class="collection-grid" id="collectionGrid"></div>

    <footer>
        🏆 Открывай паки, собирай коллекцию, обменивай дубликаты
    </footer>
</div>

        { id: 414, name: "Лукас Бойе", team: "Алавес", image: "Alaves.png", rating: 73, rarity: "common" },
        { id: 415, name: "Ибраим Диабате", team: "Алавес", image: "Alaves.png", rating: 67, rarity: "common" },
        { id: 416, name: "Мариано Диас", team: "Алавес", image: "Alaves.png", rating: 70, rarity: "common" },
        { id: 417, name: "Джони Кардосо", team: "Атлетико Мадрид", image: "atletico_madrid.png", rating: 80, rarity: "common" }
    ];

    const STORAGE_KEYS = {
        OWNED: "laliga_collection_owned",
        DUPLICATES: "laliga_collection_duplicates"
    };

    let ownedCards = {};
    let duplicates = {};
    let currentFilter = "all";

    const collectionGrid = document.getElementById('collectionGrid');
    const collectedCountSpan = document.getElementById('collectedCount');
    const totalCardsSpan = document.getElementById('totalCards');
    const totalRatingSpan = document.getElementById('totalRating');

    function loadData() {
        const savedOwned = localStorage.getItem(STORAGE_KEYS.OWNED);
        if (savedOwned) ownedCards = JSON.parse(savedOwned);
        
        const savedDuplicates = localStorage.getItem(STORAGE_KEYS.DUPLICATES);
        if (savedDuplicates) duplicates = JSON.parse(savedDuplicates);
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEYS.OWNED, JSON.stringify(ownedCards));
        localStorage.setItem(STORAGE_KEYS.DUPLICATES, JSON.stringify(duplicates));
    }

    function updateStats() {
        const collected = Object.keys(ownedCards).length;
        collectedCountSpan.textContent = collected;
        totalCardsSpan.textContent = PLAYERS.length;
        
        let totalRating = 0;
        for (let id in ownedCards) {
            const player = PLAYERS.find(p => p.id == id);
            if (player) totalRating += player.rating;
        }
        totalRatingSpan.textContent = totalRating;
    }

    function getFilteredPlayers() {
        let filtered = [...PLAYERS];
        
        switch(currentFilter) {
            case "legendary":
                filtered = filtered.filter(p => p.rarity === "legendary");
                break;
            case "epic":
                filtered = filtered.filter(p => p.rarity === "epic");
                break;
            case "rare":
                filtered = filtered.filter(p => p.rarity === "rare");
                break;
            case "owned":
                filtered = filtered.filter(p => ownedCards[p.id]);
                break;
            case "missing":
                filtered = filtered.filter(p => !ownedCards[p.id]);
                break;
            default:
                break;
        }
        
        return filtered;
    }

    function getBadgeClass(rarity) {
        switch(rarity) {
            case 'legendary': return 'badge-legendary';
            case 'epic': return 'badge-epic';
            default: return 'badge-rare';
        }
    }

    function renderCollection() {
        const filteredPlayers = getFilteredPlayers();
        
        collectionGrid.innerHTML = '';
        
        filteredPlayers.forEach(player => {
            const isOwned = ownedCards[player.id];
            const duplicateCount = duplicates[player.id] || 0;
            const badgeClass = getBadgeClass(player.rarity);
            
            const card = document.createElement('div');
            card.className = `card ${isOwned ? 'owned' : 'not-owned'}`;
            card.onclick = () => showCardModal(player);
            
            card.innerHTML = `
                <div class="badge-mini ${badgeClass}">${player.rarity === 'legendary' ? '⭐' : (player.rarity === 'epic' ? '💎' : '📘')}</div>
                <div class="card-img">${player.emoji}</div>
                <div class="card-name">${player.name}</div>
                <div class="card-rating">⭐ ${player.rating}</div>
                <div class="card-duplicates">${duplicateCount > 0 ? `📦 x${duplicateCount}` : ''}</div>
            `;
            collectionGrid.appendChild(card);
        });
    }

    function showCardModal(player) {
        const modal = document.getElementById('cardModal');
        const modalContent = document.getElementById('modalContent');
        const isOwned = ownedCards[player.id];
        const duplicateCount = duplicates[player.id] || 0;
        const badgeClass = getBadgeClass(player.rarity);
        const rarityText = player.rarity === 'legendary' ? 'Легендарная' : (player.rarity === 'epic' ? 'Эпическая' : 'Обычная');
        
        modalContent.innerHTML = `
            <div style="font-size: 4rem;">${player.emoji}</div>
            <h2>${player.name}</h2>
            <p>⚽ ${player.team}</p>
            <p>⭐ Рейтинг: ${player.rating}</p>
            <p><span class="badge ${badgeClass}" style="padding: 4px 12px;">${rarityText}</span></p>
            <p>${isOwned ? '✅ В коллекции' : '❌ Не собрана'}</p>
            ${duplicateCount > 0 ? `<p>📦 Дубликатов: ${duplicateCount}</p>` : ''}
        `;
        modal.classList.add('show');
    }

    function closeModal() {
        const modal = document.getElementById('cardModal');
        modal.classList.remove('show');
    }

    // Фильтры
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderCollection();
        });
    });

    loadData();
    updateStats();
    renderCollection();
</script>
</body>
</html>
