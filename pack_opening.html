<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Открытие пака - Ла Лига</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff4b44 0%, #ffffff 50%, #d9403a 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.1) 0%, transparent 80%);
            pointer-events: none;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 2px solid #FFD700;
            text-align: center;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 5px 12px;
            border: 2px solid #FFD700;
        }

        .logo-img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        .home-btn, .collection-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6c5ce7 0%, #5a4ace 100%);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid #FFD700;
            cursor: pointer;
        }

        .collection-btn {
            background: linear-gradient(135deg, #2a9d8f 0%, #1e6b60 100%);
        }

        .home-btn:hover, .collection-btn:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .sub {
            color: #ff4b44;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 16px;
        }

        .stat {
            font-weight: bold;
            color: #1B3B6F;
        }

        /* Упаковка */
        .pack-container {
            perspective: 1000px;
            margin: 30px 0;
            cursor: pointer;
        }

        .pack {
            width: 200px;
            height: 280px;
            margin: 0 auto;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .pack-front, .pack-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .pack-front {
            background: linear-gradient(135deg, #ff4b44, #d9403a);
            border: 3px solid #FFD700;
            transform: rotateY(0deg);
        }

        .pack-back {
            background: linear-gradient(135deg, #1B3B6F, #0F2A4A);
            border: 3px solid #FFD700;
            transform: rotateY(180deg);
            font-size: 1rem;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .pack.open {
            transform: rotateY(180deg);
        }

        .pack-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .pack-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
        }

        .pack-subtitle {
            font-size: 0.8rem;
            color: #FFD700;
            margin-top: 10px;
        }

        /* Анимация карточки */
        .card-reveal {
            margin-top: 20px;
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-display {
            background: linear-gradient(135deg, #1B3B6F, #0F2A4A);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #FFD700;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card-emoji {
            font-size: 4rem;
            background: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card-info {
            text-align: left;
            color: white;
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-team {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .card-rating {
            font-size: 1rem;
            margin-top: 5px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .badge-legendary { background: #FFFFFF; color: #FFD700; }
        .badge-epic { background: #9b59b6; color: white; }
        .badge-rare { background: #3498db; color: white; }
	.badge-common { background: #ff4a42; color: white; }

        .duplicate-info {
            color: #ff4b44;
            font-weight: bold;
            margin-top: 10px;
        }

        .new-info {
            color: #2a9d8f;
            font-weight: bold;
            margin-top: 10px;
        }

        .button-group {
            margin-top: 20px;
        }

        .next-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #1B2F4F;
            transition: 0.2s;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            color: #1B3B6F;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        .hidden {
            display: none;
        }

        .open-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #1B2F4F;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>

</div>

    // Ключи для localStorage
    const STORAGE_KEYS = {
        OWNED: "laliga_collection_owned",
        DUPLICATES: "laliga_collection_duplicates",
        LAST_OPEN: "laliga_pack_last_open",
        PACKS: "laliga_packs_available"
    };

    let packsAvailable = 1;
    let lastOpenDate = null;
    let ownedCards = {};
    let duplicates = {};
	let nextPackTime = null;

    // DOM элементы
    const pack = document.getElementById('pack');
    const packContainer = document.getElementById('packContainer');
    const openBtn = document.getElementById('openBtn');
    const resultArea = document.getElementById('resultArea');
    const cardReveal = document.getElementById('cardReveal');
    const packsAvailableSpan = document.getElementById('packsAvailable');
    const nextPackTimeSpan = document.getElementById('nextPackTime');

    // Загрузка данных
    function loadData() {
        const savedOwned = localStorage.getItem(STORAGE_KEYS.OWNED);
        if (savedOwned) ownedCards = JSON.parse(savedOwned);
        
        const savedDuplicates = localStorage.getItem(STORAGE_KEYS.DUPLICATES);
        if (savedDuplicates) duplicates = JSON.parse(savedDuplicates);
        
        const savedLastOpen = localStorage.getItem(STORAGE_KEYS.LAST_OPEN);
        if (savedLastOpen) lastOpenDate = savedLastOpen;
        
        const savedPacks = localStorage.getItem(STORAGE_KEYS.PACKS);
        if (savedPacks && !isNaN(parseInt(savedPacks))) {
            packsAvailable = parseInt(savedPacks);
        } else {
            checkAndUpdateDailyPack();
        }
        
        // Загружаем nextPackTime
        const savedNextPack = localStorage.getItem('laliga_next_pack_time');
        if (savedNextPack) {
            nextPackTime = savedNextPack;
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEYS.OWNED, JSON.stringify(ownedCards));
        localStorage.setItem(STORAGE_KEYS.DUPLICATES, JSON.stringify(duplicates));
        localStorage.setItem(STORAGE_KEYS.LAST_OPEN, lastOpenDate);
        localStorage.setItem(STORAGE_KEYS.PACKS, packsAvailable.toString());
        localStorage.setItem('laliga_next_pack_time', nextPackTime);
    }

    function checkAndUpdateDailyPack() {
        const now = new Date();
        
        // Если это первый запуск
        if (!lastOpenDate) {
            packsAvailable = 1;
            lastOpenDate = now.toISOString();
            nextPackTime = new Date(now.getTime() + 8 * 60 * 60 * 1000).toISOString();
            saveData();
            return;
        }
        
        // Если паков уже 3 — таймер не нужен
        if (packsAvailable >= 3) {
            nextPackTime = null;
            saveData();
            return;
        }
        
        const nowTime = now.getTime();
        
        // Если есть запланированное время
        if (nextPackTime) {
            const next = new Date(nextPackTime);
            
            // Если время пришло
            if (nowTime >= next.getTime()) {
                // Добавляем пак
                packsAvailable = packsAvailable + 1;
                
                // Обновляем дату последнего изменения
                lastOpenDate = now.toISOString();
                
                // Если паков всё ещё меньше 3 — планируем следующий
                if (packsAvailable < 3) {
                    nextPackTime = new Date(nowTime + 8 * 60 * 60 * 1000).toISOString();
                } else {
                    // Если паков стало 3 — таймер останавливаем
                    nextPackTime = null;
                }
                
                saveData();
                
                // Рекурсивно проверяем, не пора ли добавить ещё один пак
                // (на случай, если накопилось несколько паков за время простоя)
                checkAndUpdateDailyPack();
                return;
            }
            // Если время ещё не пришло — ничего не делаем
        } else if (packsAvailable < 3) {
            // Если nextPackTime === null, а паков меньше 3 — запускаем таймер
            nextPackTime = new Date(nowTime + 8 * 60 * 60 * 1000).toISOString();
            saveData();
        }
    }

    function updateStats() {
        packsAvailableSpan.textContent = packsAvailable;
        
        const now = new Date();
        let canOpenNow = packsAvailable > 0;
        
        if (canOpenNow) {
            nextPackTimeSpan.textContent = "Доступно!";
        } else if (nextPackTime) {
            const next = new Date(nextPackTime);
            const diff = next - now;
            
            if (diff > 0) {
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (3600000)) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                nextPackTimeSpan.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                // Время вышло - проверяем, не пора ли добавить пак
                checkAndUpdateDailyPack();
                updateStats();
                return;
            }
        } else {
            // nextPackTime = null и паков нет
            if (packsAvailable === 0) {
                // Запускаем таймер
                nextPackTime = new Date(now.getTime() + 8 * 60 * 60 * 1000).toISOString();
                saveData();
                updateStats();
                return;
            } else {
                nextPackTimeSpan.textContent = "Доступно!";
            }
        }
        
        // Обновляем состояние кнопки
        if (packsAvailable === 0) {
            openBtn.disabled = true;
            openBtn.style.opacity = '0.5';
        } else {
            openBtn.disabled = false;
            openBtn.style.opacity = '1';
        }
    }

    function getRandomPlayer() {
        const totalProbability = PLAYERS.reduce((sum, p) => sum + p.probability, 0);
        let random = Math.random() * totalProbability;
        
        for (const player of PLAYERS) {
            if (random < player.probability) {
                return player;
            }
            random -= player.probability;
        }
        return PLAYERS[0];
    }

    function getRarityText(rarity) {
        switch(rarity) {
            case 'legendary': return '🌟 Легендарная';
            case 'epic': return '💎 Эпическая';
            default: return '📘 Обычная';
        }
    }

    function getBadgeClass(rarity) {
        switch(rarity) {
            case 'legendary': return 'badge-legendary';
            case 'epic': return 'badge-epic';
            default: return 'badge-rare';
        }
    }

    function openPackAnimation() {
        if (packsAvailable <= 0) {
            alert('⏰ У тебя нет доступных паков!');
            return;
        }
        
        packsAvailable--;
        
        // Сохраняем дату последнего открытия
        lastOpenDate = new Date().toISOString();
        
        // Всегда запускаем таймер, если паков меньше 3
        if (packsAvailable < 3) {
            const now = new Date();
            nextPackTime = new Date(now.getTime() + 8 * 60 * 60 * 1000).toISOString();
        } else {
            // Если паков 3 - таймер останавливается
            nextPackTime = null;
        }
        
        saveData();
        
        pack.classList.add('shake');
        setTimeout(() => {
            pack.classList.remove('shake');
        }, 300);
        
        setTimeout(() => {
            pack.classList.add('open');
        }, 300);
        
        setTimeout(() => {
            const player = getRandomPlayer();
            const isDuplicate = ownedCards[player.id];
            
            if (isDuplicate) {
                duplicates[player.id] = (duplicates[player.id] || 0) + 1;
            } else {
                ownedCards[player.id] = true;
            }
            
            saveData();
            showResult(player, isDuplicate);
            updateStats();
        }, 800);
    }

    function showResult(player, isDuplicate) {
        pack.style.display = 'none';
        openBtn.style.display = 'none';
        
        const duplicateCount = duplicates[player.id] || 0;
        const badgeClass = getBadgeClass(player.rarity);
        const rarityText = getRarityText(player.rarity);
        
        // Определяем, что показывать: картинку или эмодзи
        const playerImage = player.image ? player.image : null;
        
        cardReveal.innerHTML = `
            <div class="card-display">
                ${playerImage ? 
                    `<img src="${playerImage}" class="card-emoji" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #FFD700;" alt="${player.name}">` : 
                    `<div class="card-emoji">${player.emoji || "⚽"}</div>`
                }
                <div class="card-info">
                    <div class="card-name">${player.name}</div>
                    <div class="card-team">⚽ ${player.team}</div>
                    <div class="card-rating">⭐ Рейтинг: ${player.rating}</div>
                    <div class="badge ${badgeClass}">${rarityText}</div>
                    ${isDuplicate ? 
                        `<div class="duplicate-info">📦 ДУБЛИКАТ! +1 дубликат (всего: ${duplicateCount})</div>` : 
                        `<div class="new-info">🎉 НОВАЯ КАРТОЧКА! Добавлена в коллекцию 🎉</div>`
                    }
                </div>
            </div>
        `;
        
        resultArea.style.display = 'block';
        resultArea.scrollIntoView({ behavior: 'smooth' });
    }

    function resetAndClose() {
        pack.style.display = 'flex';
        openBtn.style.display = 'block';
        pack.classList.remove('open');
        resultArea.style.display = 'none';
        updateStats();
        
        if (packsAvailable === 0) {
            openBtn.disabled = true;
            openBtn.style.opacity = '0.5';
        } else {
            openBtn.disabled = false;
            openBtn.style.opacity = '1';
        }
    }


    openBtn.addEventListener('click', openPackAnimation);
    document.getElementById('nextBtn').addEventListener('click', resetAndClose);
    
    setInterval(updateStats, 1000);
    
    loadData();
    updateStats();
    
    if (packsAvailable === 0) {
        openBtn.disabled = true;
        openBtn.style.opacity = '0.5';
    }
</script>
</body>
</html>
