<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Угадайка - Ла Лига</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff4b44 0%, #ffffff 50%, #d9403a 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.1) 0%, transparent 80%);
            pointer-events: none;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 2px solid #FFD700;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 5px 12px;
            border: 2px solid #FFD700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .logo-img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        .logo-error {
            display: none;
            font-size: 8px;
            color: #ff4b44;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6c5ce7 0%, #5a4ace 100%);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid #FFD700;
        }

        .home-btn:hover {
            transform: scale(1.05);
        }

        /* Заголовок */
        h1 {
            text-align: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: normal;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 5px 0;
            font-size: 2rem;
        }

        .sub {
            text-align: center;
            color: #ff4b44;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Карточка вопроса */
        .quiz-card {
            background: linear-gradient(135deg, #ff4b44 0%, #ff4b44 100%);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 2px solid #FFD700;
        }

        .question-text {
            color: #FFFFFF;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Варианты ответов */
        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .answer-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #FFD700;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .answer-btn:hover {
            background: #FFFFFF;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #00cc66;
            border-color: #00994d;
            color: white;
        }

        .answer-btn.wrong {
            background: #ff4b44;
            border-color: #d9403a;
            color: white;
        }

        .answer-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .answer-btn.disabled:hover {
            transform: none;
        }

        /* Панель статистики */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #FFD700;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score {
            background: #ffebe1;
            color: #000000;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .question-counter {
            background: #ffebe1;
            color: #000000;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
        }

        .next-btn {
            background: linear-gradient(135deg, #ffebe1 0%, #ffebe1 100%);
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #000000;
            box-shadow: 0 4px 0 #b57c1c;
            transition: 0.1s;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b57c1c;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: linear-gradient(135deg, #ffebe1 0%, #ffebe1 100%);
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #000000;
            margin-top: 15px;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #ff4b44;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffebe1;
            border: 2px solid #FFD700;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            color: #1B3B6F;
        }

        @media (max-width: 550px) {
            .container {
                padding: 20px;
            }
            .question-text {
                font-size: 1.1rem;
            }
            .answer-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="logo-container">
            <img src="laliga.png" alt="La Liga Logo" class="logo-img" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-error">⚠️ Лого</div>
        </div>
        <a href="index.html" class="home-btn">🏠 На главную</a>
    </div>

    <h1> УГАДАЙКА </h1>
    <div class="sub">Проверь свои знания об Испанском футболе</div>

    <div class="quiz-card">
        <div class="question-text" id="questionText">Загрузка...</div>
        <div class="answers" id="answersContainer"></div>
        <div class="stats">
            <div class="score" id="score">🎯 Очки: 0</div>
            <div class="question-counter" id="counter">📋 Вопрос 1 / 10</div>
            <button class="next-btn" id="nextBtn" disabled>Следующий вопрос →</button>
        </div>
    </div>

    <div class="result" id="result" style="display: none;"></div>

    <footer>
        🏆 La Liga Quiz | Вопросы о лучшей лиге мира
    </footer>
</div>

<script>
    // ===== БАНК ВОПРОСОВ (можно добавлять сколько угодно) =====
    const QUESTIONS_BANK = [
        { text: "Какая команда не вылетала из Ла Лиги, помимо Барселоны и Реала?", answers: ["Валенсия", "Севилья", "Атлетико Мадрид", "Атлетик Бильбао"], correct: "Атлетик Бильбао" },
        { text: "Какой клуб называют 'Los Blancos'?", answers: ["Барселона", "Атлетико Мадрид", "Реал Мадрид", "Севилья"], correct: "Реал Мадрид" },
        { text: "Кто выиграл трофей Саморы(лучший вратарь) в сезоне 24/25?", answers: ["Ян Облак", "Жоан Гарсия", "Тер Штеген", "Тибо Куртуа"], correct: "Ян Облак" },
        { text: "Какой клуб играет на стадионе 'Месталья'?", answers: ["Атлетико Мадрид", "Мальорка", "Реал Сосьедад", "Валенсия"], correct: "Валенсия" },
        { text: "Какая команда выиграла Ла Лигу в сезоне 2013/14?", answers: ["Барселона", "Реал Мадрид", "Атлетико Мадрид", "Севилья"], correct: "Атлетико Мадрид" },
        { text: "Какой клуб носит прозвище 'Львы'?", answers: ["Севилья", "Атлетик Бильбао", "Вильярреал", "Валенсия"], correct: "Атлетик Бильбао" },
        { text: "Какой игрок забил больше всего голов за один сезон Ла Лиги?", answers: ["Криштиану Роналду", "Лионель Месси", "Роберт Левандовски", "Карим Бензема"], correct: "Лионель Месси" },
        { text: "Какое наибольшее количество голов было забито одним игроком за один сезон в Ла Лиге?", answers: ["49", "50", "51", "52"], correct: "50" },
        { text: "Какой клуб выиграл Ла Лигу в сезоне 2023/24?", answers: ["Реал Мадрид", "Барселона", "Жирона", "Атлетико Мадрид"], correct: "Реал Мадрид" },
        { text: "Какой цвет является основным для формы 'Реал Сосьедад'?", answers: ["Красно-белый", "Сине-гранатовый", "Белый", "Сине-белый"], correct: "Сине-белый" },
        { text: "В каком году Ла Лига была переименована из 'Primera División' в 'La Liga'?", answers: ["1996", "2000", "2008", "2010"], correct: "2008" },
        { text: "Какой клуб из Ла Лиги имеет прозвище 'Los Che'?", answers: ["Валенсия", "Вильярреал", "Эльче", "Леванте"], correct: "Валенсия" },
        { text: "Какой клуб в Ла Лиге играет на стадионе 'Эль Садар'?", answers: ["Осасуна", "Реал Сосьедад", "Алавес", "Сарагоса"], correct: "Осасуна" },
        { text: "Какой клуб из Ла Лиги имеет на гербе летучую мышь?", answers: ["Валенсия", "Леванте", "Барселона", "Мальорка"], correct: "Валенсия" },
        { text: "Какой игрок забил самый быстрый гол в истории Ла Лиги?", answers: ["Криштиану Роналду", "Лионель Месси", "Хосеба Льоренте", "Андер Итурраспе"], correct: "Хосеба Льоренте" (7 секунд) },
        { text: "Какой игрок отдал больше всего голевых передач в истории Ла Лиги?", answers: ["Лионель Месси", "Андрес Иньеста", "Хави", "Лука Модрич"], correct: "Лионель Месси" },
        { text: "Кто был самым молодым дебютантом в истории Ла Лиги?", answers: ["Ламин Ямаль", "Ансу Фати", "Педри", "Гави"], correct: "Ламин Ямаль" (15 лет 8 дней) },
        { text: "Кто является лучшим бомбардиром сборной Испании за всю историю?", answers: ["Давид Вилья", "Рауль Гонсалес", "Фернандо Торрес", "Альваро Мората"], correct: "Давид Вилья" (59 голов) },
        { text: "Кто забил победный гол в финале Евро-2012 против Италии?", answers: ["Хави", "Давид Сильва", "Фернандо Торрес", "Андреас Иньеста"], correct: "Фернандо Торрес" },
        { text: "Какой тренер выиграл больше всего титулов Ла Лиги?", answers: ["Мигель Муньос", "Йохан Кройф", "Пеп Гвардиола", "Зинедин Зидан"], correct: "Мигель Муньос" (9 титулов) },
        { text: "Какой клуб был первым чемпионом Ла Лиги?", answers: ["Реал Мадрид", "Барселона", "Атлетик Бильбао", "Атлетико Мадрид"], correct: "Барселона" (1929) },
        { text: "Какой игрок был первым обладателем 'Золотого мяча' в Ла Лиге?", answers: ["Альфредо Ди Стефано", "Луис Суарес Мирамонтес", "Лев Яшин", "Флориан Альберт"], correct: "Альфредо Ди Стефано" },
        { text: "Какой игрок забил больше всего голов со штрафных в истории Ла Лиги?", answers: ["Лионель Месси", "Криштиану Роналду", "Роналдиньо", "Антонио Пуэрта"], correct: "Лионель Месси" (более 30 голов) },
        { text: "Какой самый дорогой трансфер в истории Ла Лиги на вход?", answers: ["Криштиану Роналду", "Усман Дембеле", "Филиппе Коутиньо", "Жоау Феликс"], correct: "Усман Дембеле" },
        { text: "Какой самый дорогой трансфер в истории Ла Лиги на выход?", answers: ["Криштиану Роналду", "Кепа Арризабалага", "Неймар", "Александер Исак"], correct: "Неймар" },
        { text: "Какой игрок является рекордсменом по числу матчей в Ла Лиге?", answers: ["Хоакин", "Икер Касильяс", "Рауль Гонсалес", "Лионель Месси"], correct: "Хоакин" (622 матча) },
        { text: "Сколько раз 'Барселона' выигрывала Ла Лигу при Пепе Гвардиоле?", answers: ["2", "3", "4", "5"], correct: "3" (2008/09, 2009/10, 2010/11) },
        { text: "Какой стадион в Ла Лиге был построен раньше всех?", answers: ["Камп Ноу", "Сантьяго Бернабеу", "Месталья", "Аноэта"], correct: "Месталья" (1923 год) },
        { text: "Какой клуб играет на стадионе 'Балаидос'?", answers: ["Сельта", "Депортиво", "Алавес", "Осасуна"], correct: "Сельта" },
        { text: "Сколько воспитанников 'Барселоны' находились в основной команде 'Реал Мадрида'?", answers: ["4", "5", "6", "7"], correct: "7" },
        { text: "Какой игрок забил больше всего голов в одном календарном году в Ла Лиге?", answers: ["Лионель Месси", "Криштиану Роналду", "Роберт Левандовски", "Карим Бензема"], correct: "Лионель Месси" (2012 год, 79 голов во всех турнирах, в Ла Лиге — 50) },
        { text: "Кто является самым возрастным игроком, забившим гол в Ла Лиге?", answers: ["Хоакин", "Андрес Иньеста", "Хосе Луис Сьерра", "Лионель Месси"], correct: "Хоакин" (40 лет, 6 месяцев) },
        { text: "Какой клуб имеет прозвище 'El Submarino Amarillo' (Жёлтая подводная лодка)?", answers: ["Вильярреал", "Леванте", "Кадис", "Мальорка"], correct: "Вильярреал" },
        { text: "Какой клуб имеет прозвище 'Los Boquerones' (Анчоусы)?", answers: ["Малага", "Кадис", "Альмерия", "Хетафе"], correct: "Малага" },
        { text: "Какой клуб забил больше всего голов в одном сезоне Ла Лиги?", answers: ["Реал Мадрид", "Барселона", "Атлетико Мадрид", "Севилья"], correct: "Реал Мадрид" (2011/12, 121 гол) }
    ];

    const QUESTIONS_PER_GAME = 10;  // Количество вопросов за игру
    let currentQuestions = [];      // Вопросы для текущей игры
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    // DOM элементы
    const questionText = document.getElementById('questionText');
    const answersContainer = document.getElementById('answersContainer');
    const nextBtn = document.getElementById('nextBtn');
    const scoreDisplay = document.getElementById('score');
    const counterDisplay = document.getElementById('counter');
    const resultDiv = document.getElementById('result');

    // Перемешивание массива
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Выбор случайных вопросов из банка (без повторений)
    function selectRandomQuestions() {
        const shuffled = shuffleArray([...QUESTIONS_BANK]);
        return shuffled.slice(0, QUESTIONS_PER_GAME);
    }

    // Перемешивание вариантов ответов для вопроса
    function shuffleAnswers(question) {
        const shuffledAnswers = shuffleArray([...question.answers]);
        return { ...question, answers: shuffledAnswers };
    }

    // Загрузить текущий вопрос
    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        answered = false;
        nextBtn.disabled = true;
        
        const question = currentQuestions[currentIndex];
        questionText.textContent = question.text;
        
        counterDisplay.textContent = `📋 Вопрос ${currentIndex + 1} / ${currentQuestions.length}`;
        
        answersContainer.innerHTML = '';
        question.answers.forEach(answer => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.textContent = answer;
            btn.onclick = () => checkAnswer(btn, answer, question.correct);
            answersContainer.appendChild(btn);
        });
    }

    // Проверка ответа
    function checkAnswer(btn, selected, correct) {
        if (answered) return;
        answered = true;
        
        const allBtns = document.querySelectorAll('.answer-btn');
        allBtns.forEach(btn => {
            btn.classList.add('disabled');
        });
        
        allBtns.forEach(btn => {
            if (btn.textContent === correct) {
                btn.classList.add('correct');
            }
        });
        
        if (selected === correct) {
            btn.classList.add('correct');
            score++;
            updateScoreDisplay();
            showTemporaryMessage('✅ Правильно! +1 очко', '#00cc66');
        } else {
            btn.classList.add('wrong');
            showTemporaryMessage(`❌ Неправильно! Правильный ответ: ${correct}`, '#ff4b44');
        }
        
        nextBtn.disabled = false;
    }

    // Временное сообщение
    function showTemporaryMessage(message, bgColor) {
        resultDiv.textContent = message;
        resultDiv.style.backgroundColor = bgColor;
        resultDiv.style.color = 'white';
        resultDiv.style.display = 'block';
        setTimeout(() => {
            if (resultDiv.textContent === message) {
                resultDiv.style.display = 'none';
            }
        }, 1500);
    }

    // Обновить отображение очков
    function updateScoreDisplay() {
        scoreDisplay.textContent = `🎯 Очки: ${score}`;
    }

    // Завершение игры
    function endGame() {
        const percentage = Math.round((score / currentQuestions.length) * 100);
        let message = '';
        
        if (percentage === 100) {
            message = '🏆 ИДЕАЛЬНО! Ты настоящий эксперт! 🏆';
        } else if (percentage >= 70) {
            message = '🎉 Отлично! Ты хорошо знаешь испанский футбол! 🎉';
        } else if (percentage >= 50) {
            message = '👍 Неплохо! Но есть куда расти! 👍';
        } else {
            message = '📚 Попробуй ещё раз! 📚';
        }
        
        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = '#ff4b44';
        resultDiv.style.color = '#ffebe1';
        resultDiv.innerHTML = `
            <strong>ИГРА ЗАКОНЧЕНА!</strong><br>
            Твой результат: ${score} из ${currentQuestions.length} (${percentage}%)<br>
            ${message}<br>
            <button class="reset-btn" onclick="resetGame()">🔄 Сыграть снова</button>
        `;
        
        questionText.textContent = 'Игра завершена!';
        answersContainer.innerHTML = '';
        nextBtn.disabled = true;
    }

    // Сброс игры
    function resetGame() {
        startNewGame();
    }

    // Следующий вопрос
    function nextQuestion() {
        if (!answered && currentIndex < currentQuestions.length) return;
        currentIndex++;
        loadQuestion();
    }

    // Новая игра
    function startNewGame() {
        currentQuestions = selectRandomQuestions();
        currentQuestions = currentQuestions.map(q => shuffleAnswers(q));
        currentIndex = 0;
        score = 0;
        answered = false;
        resultDiv.style.display = 'none';
        nextBtn.disabled = true;
        updateScoreDisplay();
        loadQuestion();
    }

    // Обработчики событий
    nextBtn.addEventListener('click', nextQuestion);
    
    // Запуск игры
    startNewGame();
</script>
</body>
</html>
