<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Угадай футболиста - Ла Лига</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff4b44 0%, #ffffff 50%, #d9403a 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.1) 0%, transparent 80%);
            pointer-events: none;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 2px solid #FFD700;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 5px 12px;
            border: 2px solid #FFD700;
        }

        .logo-img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        .logo-error {
            display: none;
            font-size: 8px;
            color: #ff4b44;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6c5ce7 0%, #5a4ace 100%);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid #FFD700;
        }

        .home-btn:hover {
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: normal;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
            font-size: 1.8rem;
        }

        .sub {
            text-align: center;
            color: #ff4b44;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            background: #ddd;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .level-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1B3B6F;
        }

        .quiz-card {
            background: linear-gradient(135deg, #1B3B6F 0%, #0F2A4A 100%);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 2px solid #FFD700;
        }

        .question-text {
            color: #FFD700;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .player-hint {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            color: white;
            font-size: 0.85rem;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .answer-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #FFD700;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #1B3B6F;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .answer-btn:hover {
            background: #FFD700;
            transform: translateX(5px);
        }

        .answer-btn.correct {
            background: #2a9d8f;
            border-color: #1e6b60;
            color: white;
        }

        .answer-btn.wrong {
            background: #ff4b44;
            border-color: #d9403a;
            color: white;
        }

        .answer-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .answer-btn.disabled:hover {
            transform: none;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score {
            background: #1B3B6F;
            color: #FFD700;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
        }

        .next-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #1B2F4F;
            box-shadow: 0 4px 0 #B57C1C;
            transition: 0.1s;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #B57C1C;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            color: #FFD700;
            border: 1px solid #FFD700;
        }

        .reset-btn {
            background: linear-gradient(135deg, #e9c46a 0%, #d4a373 100%);
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #2c3e50;
            margin-top: 10px;
        }

        .save-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a9d8f;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            color: #1B3B6F;
        }

        @media (max-width: 550px) {
            .container {
                padding: 20px;
            }
            .question-text {
                font-size: 1rem;
            }
            .answer-btn {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="logo-container">
            <img src="laliga.png" alt="La Liga Logo" class="logo-img" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-error">⚠️ Лого</div>
        </div>
        <a href="index.html" class="home-btn">🏠 На главную</a>
    </div>

    <h1>⚡ УГАДАЙ ФУТБОЛИСТА ⚡</h1>
    <div class="sub">Легенды и звёзды Ла Лиги</div>

    <div class="progress-container">
        <div class="level-info">
            <span>📊 Вопрос <span id="currentQuestion">1</span> / <span id="totalQuestions"></span></span>
            <span>🏆 Правильных: <span id="correctCount">0</span></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="quiz-card">
        <div class="question-text" id="questionText">Загрузка...</div>
        <div class="answers" id="answersContainer"></div>
        <div class="stats">
            <div class="score" id="scoreDisplay">🎯 Очки: 0</div>
            <button class="next-btn" id="nextBtn" disabled>Следующий вопрос →</button>
        </div>
    </div>

    <div id="result" style="display: none;"></div>

    <footer>
        🏆 Ла Лига: легендарные футболисты
    </footer>
</div>

<div class="save-indicator" id="saveIndicator">💾 Прогресс сохранён</div>

<script>
    // ===== БАНК ВОПРОСОВ (можно добавлять сколько угодно) =====
    const QUESTIONS_BANK = [
        { text: "Какой аргентинский футболист считается лучшим игроком в истории Ла Лиги, забил больше всех голов за один сезон?", hint: "Выступал за Барселону с 2000 по 2021 год, 10-й номер", correct: "Лионель Месси", incorrects: ["Диего Марадона", "Серхио Агуэро", "Анхель Ди Мария"] },
        { text: "Какой португальский супербомбардир установил рекорд по голам в одном сезоне Ла Лиги (48 голов)?", hint: "Играл за Реал Мадрид под 7-м номером", correct: "Криштиану Роналду", incorrects: ["Эйсебио", "Луиш Фигу", "Руй Кошта"] },
        { text: "Какой французский нападающий долгое время был капитаном Реал Мадрида и выиграл 5 Лиг Чемпионов?", hint: "Носил номер 9, затем 10, завершил карьеру в 2023 году", correct: "Карим Бензема", incorrects: ["Зинедин Зидан", "Тьерри Анри", "Килиан Мбаппе"] },
        { text: "Какой испанский вратарь считается легендой Реал Мадрида и сборной Испании, выиграл ЧЕ-2008 и ЧМ-2010?", hint: "Играл под номером 1, известен как 'Сан-Икер'", correct: "Икер Касильяс", incorrects: ["Виктор Вальдес", "Давид Де Хеа", "Пепе Рейна"] },
        { text: "Какой хорватский полузащитник выиграл 'Золотой мяч' в 2018 году, играя за Реал Мадрид?", hint: "Обладатель уникального дриблинга, номер 7 в сборной Хорватии", correct: "Лука Модрич", incorrects: ["Иван Ракитич", "Матео Ковачич", "Иван Перишич"] },
        { text: "Какой уругвайский нападающий выступал за Атлетико Мадрид и Барселону, выиграл 'Золотую бутсу'?", hint: "Известен своим характером и высоким прыжком, номер 9", correct: "Луис Суарес", incorrects: ["Эдинсон Кавани", "Диего Форлан", "Дарвин Нуньес"] },
        { text: "Какой немецкий вратарь известен своей игрой за Барселону и прозвищем 'Кошка'?", hint: "Выиграл ЧМ-2014, играл под номером 1", correct: "Марк-Андре тер Штеген", incorrects: ["Мануэль Нойер", "Оливер Кан", "Йенс Леманн"] },
        { text: "Какой бразильский защитник считается одним из лучших левых защитников в истории, играл за Реал Мадрид?", hint: "Носил номер 12, известен своими подключениями в атаку", correct: "Роберто Карлос", incorrects: ["Кафу", "Марсело", "Дани Алвес"] },
        { text: "Какой испанский полузащитник был лидером 'Барселоны' и сборной Испании, выиграл всё возможное?", hint: "Номер 8, известен своим контролем мяча и 'тики-такой'", correct: "Хави Эрнандес", incorrects: ["Андрес Иньеста", "Серхио Бускетс", "Сеск Фабрегас"] },
        { text: "Какой польский нападающий побил рекорд Месси по голам за один сезон Ла Лиги (47 голов)?", hint: "Сейчас играет за Барселону, лучший бомбардир 2022 года", correct: "Роберт Левандовски", incorrects: ["Аркадиуш Милик", "Кшиштоф Пёнтек", "Ян Беднарек"] },
        { text: "Какой испанский полузащитник автор победного гола в финале ЧМ-2010?", hint: "Носил номер 6, известен своим дриблингом", correct: "Андрес Иньеста", incorrects: ["Хави", "Сеск Фабрегас", "Давид Сильва"] },
        { text: "Какой бразильский нападающий играл за Барселону и выиграл 'Золотой мяч' в 2005 году?", hint: "Прозвище 'Зубастик'", correct: "Роналдиньо", incorrects: ["Роналдо", "Ривалдо", "Ромарио"] },
        { text: "Какой испанский защитник был капитаном сборной Испании на ЧМ-2010?", hint: "Играл за Реал Мадрид и Барселону", correct: "Икер Касильяс", incorrects: ["Карлес Пуйоль", "Серхио Рамос", "Хаби Алонсо"] }
    ];

    const QUESTIONS_PER_GAME = 10;  // Количество вопросов за игру
    let currentQuestions = [];      // Выбранные вопросы для текущей игры
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // DOM элементы
    const questionText = document.getElementById('questionText');
    const answersContainer = document.getElementById('answersContainer');
    const nextBtn = document.getElementById('nextBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const currentQuestionSpan = document.getElementById('currentQuestion');
    const totalQuestionsSpan = document.getElementById('totalQuestions');
    const correctCountSpan = document.getElementById('correctCount');
    const progressFill = document.getElementById('progressFill');
    const resultDiv = document.getElementById('result');
    const saveIndicator = document.getElementById('saveIndicator');

    // ===== ВЫБОР СЛУЧАЙНЫХ ВОПРОСОВ (без повторений) =====
    function selectRandomQuestions() {
        const shuffled = [...QUESTIONS_BANK];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, QUESTIONS_PER_GAME);
    }

    // ===== СОХРАНЕНИЕ ПРОГРЕССА =====
    function saveProgress() {
        const saveData = {
            currentQuestions: currentQuestions,
            currentQuestionIndex: currentQuestionIndex,
            score: score,
            answered: answered,
            savedAt: new Date().toISOString()
        };
        localStorage.setItem('quiz_progress', JSON.stringify(saveData));
        
        saveIndicator.style.opacity = '1';
        setTimeout(() => {
            saveIndicator.style.opacity = '0';
        }, 1000);
    }

    // ===== ЗАГРУЗКА ПРОГРЕССА =====
    function loadProgress() {
        const saved = localStorage.getItem('quiz_progress');
        if (!saved) return false;
        
        try {
            const data = JSON.parse(saved);
            if (data.currentQuestions && data.currentQuestions.length === QUESTIONS_PER_GAME) {
                currentQuestions = data.currentQuestions;
                currentQuestionIndex = data.currentQuestionIndex;
                score = data.score;
                answered = data.answered;
                
                if (currentQuestionIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
                
                updateScoreDisplay();
                return true;
            }
        } catch(e) {
            console.log('Ошибка загрузки прогресса:', e);
        }
        return false;
    }

    // Загрузка вопроса
    function loadQuestion() {
        if (currentQuestionIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        answered = false;
        nextBtn.disabled = true;
        
        const question = currentQuestions[currentQuestionIndex];
        questionText.innerHTML = `${question.text}<div class="player-hint">💡 Подсказка: ${question.hint}</div>`;
        
        currentQuestionSpan.textContent = currentQuestionIndex + 1;
        totalQuestionsSpan.textContent = currentQuestions.length;
        
        const progressPercent = (currentQuestionIndex / currentQuestions.length) * 100;
        progressFill.style.width = `${progressPercent}%`;
        
        // Собираем все варианты ответов и перемешиваем
        const allAnswers = [question.correct, ...question.incorrects];
        for (let i = allAnswers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allAnswers[i], allAnswers[j]] = [allAnswers[j], allAnswers[i]];
        }
        
        answersContainer.innerHTML = '';
        allAnswers.forEach(answer => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.textContent = answer;
            btn.onclick = () => checkAnswer(btn, answer, question.correct);
            answersContainer.appendChild(btn);
        });
        
        updateScoreDisplay();
        saveProgress();
    }

    // Проверка ответа
    function checkAnswer(btn, selected, correct) {
        if (answered) return;
        answered = true;
        
        const allBtns = document.querySelectorAll('.answer-btn');
        allBtns.forEach(btn => {
            btn.classList.add('disabled');
        });
        
        allBtns.forEach(btn => {
            if (btn.textContent === correct) {
                btn.classList.add('correct');
            }
        });
        
        if (selected === correct) {
            btn.classList.add('correct');
            score++;
            updateScoreDisplay();
            showTemporaryMessage('✅ Правильно! +1 очко', '#2a9d8f');
        } else {
            btn.classList.add('wrong');
            showTemporaryMessage(`❌ Неправильно! Правильный ответ: ${correct}`, '#ff4b44');
        }
        
        nextBtn.disabled = false;
        saveProgress();
    }

    // Временное сообщение
    function showTemporaryMessage(message, bgColor) {
        const oldDisplay = resultDiv.style.display;
        resultDiv.textContent = message;
        resultDiv.style.backgroundColor = bgColor;
        resultDiv.style.color = 'white';
        resultDiv.style.display = 'block';
        setTimeout(() => {
            if (resultDiv.textContent === message) {
                resultDiv.style.display = 'none';
            }
        }, 1500);
    }

    // Обновить отображение очков
    function updateScoreDisplay() {
        scoreDisplay.textContent = `🎯 Очки: ${score}`;
        correctCountSpan.textContent = score;
    }

    // Следующий вопрос
    function nextQuestion() {
        if (!answered && currentQuestionIndex < currentQuestions.length) return;
        currentQuestionIndex++;
        loadQuestion();
    }

    // Завершение игры
    function endGame() {
        const percentage = Math.round((score / currentQuestions.length) * 100);
        let message = '';
        
        if (percentage === 100) {
            message = '🏆 ИДЕАЛЬНО! Ты настоящий эксперт Ла Лиги! Ты знаешь всех звёзд! 🏆';
        } else if (percentage >= 70) {
            message = '🎉 Отлично! Ты хорошо знаешь футболистов Ла Лиги! 🎉';
        } else if (percentage >= 50) {
            message = '👍 Неплохо! Посмотри матчи Ла Лиги, чтобы узнать больше! 👍';
        } else {
            message = '📚 Попробуй ещё раз! Следи за звездами Ла Лиги! 📚';
        }
        
        progressFill.style.width = '100%';
        
        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = '#1a1a2e';
        resultDiv.style.color = '#FFD700';
        resultDiv.innerHTML = `
            <strong>🏁 ИГРА ЗАКОНЧЕНА! 🏁</strong><br>
            Твой результат: ${score} из ${currentQuestions.length} (${percentage}%)<br>
            ${message}<br>
            <button class="reset-btn" onclick="resetGame()" style="margin-top: 15px;">🔄 Сыграть снова</button>
        `;
        
        questionText.innerHTML = 'Игра завершена! Сыграйте снова, чтобы проверить знания!';
        answersContainer.innerHTML = '';
        nextBtn.disabled = true;
        
        // Очищаем сохранённый прогресс
        localStorage.removeItem('quiz_progress');
    }

    // Сброс игры
    function resetGame() {
        startNewGame();
    }

    // Новая игра
    function startNewGame() {
        currentQuestions = selectRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        resultDiv.style.display = 'none';
        nextBtn.disabled = true;
        updateScoreDisplay();
        loadQuestion();
    }

    // Обработчики событий
    nextBtn.addEventListener('click', nextQuestion);
    
    // Запуск игры
    totalQuestionsSpan.textContent = QUESTIONS_PER_GAME;
    
    // Пытаемся загрузить сохранённый прогресс
    const hasProgress = loadProgress();
    if (!hasProgress) {
        startNewGame();
    }
</script>
</body>
</html>
